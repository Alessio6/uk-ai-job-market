[project]
name = "uk-ai-job-market"
version = "0.1.0"
description = "An end-to-end project analysing the UK job market for AI, ML and data science roles."
readme = "README.md"
authors = [{ name = "Alessio" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.scripts]
uk-ai-job-market = "uk_ai_job_market:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict= is fine for same-length columns
